[functions.posthog-stats]
enabled = true
verify_jwt = false # Auth and super_admin role are explicitly verified inside index.ts
import_map = "./functions/posthog-stats/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/posthog-stats/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/posthog-stats/*.html" ]

# Gateway auth disabled for publishable-key compatibility; the handler checks
# auth.getUser(token), is_super_admin() and rate-limits before each operation.
[functions.admin-email-confirmations]
enabled = true
verify_jwt = false
import_map = "./functions/admin-email-confirmations/deno.json"
entrypoint = "./functions/admin-email-confirmations/index.ts"
