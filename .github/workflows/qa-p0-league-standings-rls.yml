name: QA P0 Standings RLS — synthetic only
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/security/league-standings-rls-p0-2026-11-07.qa-only.sql"
      - "tests/fixtures/sharkania-p0-league-standings-rls-qa.sql"
      - ".github/workflows/qa-p0-league-standings-rls.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standings-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa_local_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: qa_local_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Ensure local psql available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Reproduce permissive RLS then test primary-admin-only replacement and full rollback
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTIONS" == "true" && "$PGHOST" == "127.0.0.1" && "$PGPORT" == "5432" ]] || {
            echo "STOP: no external database allowed"; exit 1;
          }
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN;'
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN;'
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/sharkania-p0-league-standings-rls-qa.sql
