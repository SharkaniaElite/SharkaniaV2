name: Validate SEO and access controls
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npx vite build
      - name: Compile Cloudflare Pages Functions (catch syntax and bundling failures)
        run: npx --yes wrangler@4 pages functions build --outdir=.tmp-cloudflare-functions
