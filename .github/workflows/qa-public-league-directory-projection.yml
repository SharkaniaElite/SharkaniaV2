name: QA public league directory projection (NO DEPLOY)
on:
  push:
    branches: [qa/public-league-directory-projection-2026-11-22]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://qa-fake.supabase.co
      VITE_SUPABASE_ANON_KEY: qa-fake-anon-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.mjs
      - run: npm run build
