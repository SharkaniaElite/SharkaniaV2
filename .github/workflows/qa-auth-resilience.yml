name: QA Auth subscription resilience (isolated)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify no Auth event deadlock, safe remounts and session race guards
        run: node --test tests/auth-session-resilience.test.mjs
      - name: Exercise auth runtime with controlled fake sessions (no production API)
        run: node --test tests/auth-session-runtime.test.mjs
      - name: TypeScript strict build
        run: npx tsc -b --pretty false
