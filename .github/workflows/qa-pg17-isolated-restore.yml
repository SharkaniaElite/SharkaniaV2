name: QA isolated PostgreSQL restore

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qa-pg17-isolated-restore.yml
      - scripts/recovery/**
      - tests/pg17-isolated-restore.sh
      - tests/fixtures/pg17-isolated-restore/**

permissions:
  contents: read

jobs:
  synthetic-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pull the pinned PostgreSQL image before isolation
        run: docker pull "$(bash scripts/recovery/pg17-restore.sh image)"
      - name: Verify restore, failure handling, and cleanup with synthetic data
        run: |
          sudo swapoff --all
          bash tests/pg17-isolated-restore.sh
