name: QA Sharkania Intelligence host isolation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject preview hosts in PostHog dashboard query
        run: node --test tests/posthog-domain-filter-contract.test.mjs
