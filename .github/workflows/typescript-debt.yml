name: TypeScript debt baseline
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit TypeScript without hiding remaining errors
        run: |
          set +e
          npx tsc -b --pretty false > type-errors.log 2>&1
          code=$?
          echo "TypeScript exit code: $code"
          echo "TypeScript diagnostics: $(grep -c 'error TS[0-9]' type-errors.log || true)"
          grep -E 'error TS[0-9]' type-errors.log | head -n 120 || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: type-errors.log
