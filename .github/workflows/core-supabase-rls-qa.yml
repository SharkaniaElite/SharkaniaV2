name: Validate core Supabase RLS proposal (isolated PostgreSQL)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: qa_local_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Create fake identities and isolated row-level-security fixtures
        run: psql -v ON_ERROR_STOP=1 -f tests/fixtures/sharkania-rls-qa-setup.sql
      - name: Test actual SQL proposal under anonymous, player, club-admin, finance and superadmin
        run: psql -v ON_ERROR_STOP=1 -f tests/fixtures/sharkania-rls-qa-assert.sql
